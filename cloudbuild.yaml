steps:
  # Build the Docker image (effect-ontology-core for Terraform-managed Cloud Run)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/effect-ontology-core:$BUILD_ID', '-f', 'packages/@core-v2/Dockerfile', '.']

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/effect-ontology-core:$BUILD_ID']

  # Tag as latest
  - name: 'gcr.io/cloud-builders/docker'
    args: ['tag', 'gcr.io/$PROJECT_ID/effect-ontology-core:$BUILD_ID', 'gcr.io/$PROJECT_ID/effect-ontology-core:latest']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/effect-ontology-core:latest']

  # Tag as dev
  - name: 'gcr.io/cloud-builders/docker'
    args: ['tag', 'gcr.io/$PROJECT_ID/effect-ontology-core:$BUILD_ID', 'gcr.io/$PROJECT_ID/effect-ontology-core:dev']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/effect-ontology-core:dev']

images:
  - 'gcr.io/$PROJECT_ID/effect-ontology-core:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/effect-ontology-core:latest'
  - 'gcr.io/$PROJECT_ID/effect-ontology-core:dev'

timeout: '1200s'
