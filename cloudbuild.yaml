steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/effect-ontology:$COMMIT_SHA', '-f', 'packages/@core-v2/Dockerfile', '.']

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/effect-ontology:$COMMIT_SHA']

  # Tag as latest
  - name: 'gcr.io/cloud-builders/docker'
    args: ['tag', 'gcr.io/$PROJECT_ID/effect-ontology:$COMMIT_SHA', 'gcr.io/$PROJECT_ID/effect-ontology:latest']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/effect-ontology:latest']

images:
  - 'gcr.io/$PROJECT_ID/effect-ontology:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/effect-ontology:latest'

timeout: '1200s'
